<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamSathi – Admin जाँच</title>
<style>body{font:17px system-ui,sans-serif;background:#f5f3ff;margin:0;padding:16px}.c{max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:18px}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;font:inherit;box-sizing:border-box}
button{background:#6d28d9;color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;width:100%;margin-top:6px}.e{color:#dc2626}.o{color:#16a34a}code{word-break:break-all;background:#eee;padding:2px 4px;border-radius:4px}</style></head>
<body><div class="c"><h2>🔍 Admin जाँच</h2>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<button id="go">जाँच करें</button><div id="out" style="margin-top:14px"></div></div>
<script type="module">
import {config} from "./firebase-config.js";
const B="https://www.gstatic.com/firebasejs/10.14.1/firebase-";
const [{initializeApp},A,F]=await Promise.all(["app","auth","firestore"].map(x=>import(`${B}${x}.js`)));
const app=initializeApp(config),au=A.getAuth(app),db=F.getFirestore(app),o=document.getElementById("out");
const esc=s=>String(s).replace(/[&<>]/g,"");
document.getElementById("go").onclick=async()=>{o.innerHTML="कृपया रुकें…";let h="";
 try{const c=await A.signInWithEmailAndPassword(au,document.getElementById("em").value.trim(),document.getElementById("pw").value);
  const uid=c.user.uid;
  h+=`<p>Project: <code>${esc(config.projectId)}</code></p><p>Login सही ✔<br>Email: <code>${esc(c.user.email)}</code></p>`;
  h+=`<p>इस account की UID (${uid.length} अक्षर):<br><code>${esc(uid)}</code></p>`;
  h+=`<p>बड़े I और छोटे l का फ़र्क़ देखने के लिए:<br><code>${esc(uid.replace(/I/g,"[बड़ा-I]").replace(/l/g,"[छोटा-L]").replace(/O/g,"[बड़ा-O]").replace(/0/g,"[ज़ीरो]"))}</code></p>`;
  try{const d=await F.getDoc(F.doc(db,"admins",uid));
   h+=d.exists()?`<p class="o">✔ Firestore में <b>admins/${esc(uid)}</b> मिल गया। Admin सही है।</p>`:`<p class="e">✖ Firestore में <b>admins/${esc(uid)}</b> नहीं मिला। (document का नाम इस UID से मेल नहीं खाता, या वह ग़लत जगह बना है।)</p>`}
  catch(e){h+=`<p class="e">✖ Firestore पढ़ने में error: <code>${esc(e.code||e.message)}</code></p>`}
 }catch(e){h+=`<p class="e">Login नहीं हुआ: ${esc(e.code||e.message)}</p>`}
 o.innerHTML=h};
</script></body></html>
