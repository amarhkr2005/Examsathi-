<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamSathi – Admin UID</title>
<style>body{font:17px system-ui,sans-serif;background:#f5f3ff;margin:0;padding:16px}.c{max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:18px}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;font:inherit;box-sizing:border-box}
button{background:#6d28d9;color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;width:100%;margin-top:6px}.e{color:#dc2626}.o{color:#16a34a}</style></head>
<body><div class="c"><h2>📘 ExamSathi – अपनी UID देखें</h2>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<button id="go">Login करके UID देखें</button><div id="out" style="margin-top:14px"></div></div>
<script type="module">
import {config} from "./firebase-config.js";
const B="https://www.gstatic.com/firebasejs/10.14.1/firebase-";
const [{initializeApp},A,F]=await Promise.all(["app","auth","firestore"].map(x=>import(`${B}${x}.js`)));
const app=initializeApp(config),au=A.getAuth(app),db=F.getFirestore(app),o=document.getElementById("out");
document.getElementById("go").onclick=async()=>{o.innerHTML="कृपया रुकें…";
 try{const c=await A.signInWithEmailAndPassword(au,document.getElementById("em").value.trim(),document.getElementById("pw").value);
  const uid=c.user.uid;let adm=false;try{adm=(await F.getDoc(F.doc(db,"admins",uid))).exists()}catch(e){}
  o.innerHTML=`<p><b>आपकी UID:</b></p><input id="u" readonly value="${uid}"><button id="cp">UID Copy करें</button>
  <p class="${adm?"o":"e"}">${adm?"✔ यह account Admin है। Admin login चलना चाहिए।":"✖ यह account अभी Admin नहीं है। ऊपर की UID को Firestore → admins में Document ID बनाएँ।"}</p>`;
  document.getElementById("cp").onclick=()=>{const u=document.getElementById("u");u.select();navigator.clipboard&&navigator.clipboard.writeText(uid);document.getElementById("cp").textContent="Copy हो गई ✓"}
 }catch(e){o.innerHTML=`<p class="e">Login नहीं हुआ: ${String(e.code||e.message).replace(/</g,"")}</p>`}};
</script></body></html>
